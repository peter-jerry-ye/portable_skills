name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable-skill:
    name: Portable skill checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate packaged files
        run: ./scripts/ci.sh shape

      - name: Install wasm-tools
        run: cargo install --locked wasm-tools

      - name: Verify Wasm artifacts
        run: ./scripts/ci.sh artifact
