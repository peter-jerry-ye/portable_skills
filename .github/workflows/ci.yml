name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable-skill:
    name: Portable skill checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate packaged files
        run: ./scripts/ci.sh shape

      - name: Verify Wasm checksum and metadata
        run: ./scripts/ci.sh artifact

      - name: Install Wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Smoke test bundled Wasm
        run: ./scripts/ci.sh smoke
